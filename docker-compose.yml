# Databases only (default):  docker compose up -d
# API + PostgreSQL:           docker compose --profile app up --build
# API + MSSQL:                docker compose --profile app-mssql up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: YourStrongPass123
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrongPass123" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  api:
    profiles: ["app"]
    build: .
    image: typeorm-mssql-postgres-demo:local
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DB_TYPE: postgres
      DATABASE_URL: postgres://user:pass@postgres:5432/demo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api-mssql:
    profiles: ["app-mssql"]
    build: .
    image: typeorm-mssql-postgres-demo:local
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DB_TYPE: mssql
      DATABASE_URL: Server=mssql,1433;Database=demo;User Id=sa;Password=YourStrongPass123;TrustServerCertificate=true;
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  mssql-data:
